# Import-only stub for the `lerobot` package.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-stub"
version = "0.0.0"
description = "Import-only stub for `lerobot` so cosmos-framework configs build without the real package."

[tool.setuptools]
packages = ["lerobot", "lerobot.datasets"]
