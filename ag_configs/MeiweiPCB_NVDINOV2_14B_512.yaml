job:
  project: anomaly_gen
  group: MeiweiPCB
  name: MeiweiPCB_training_exp_FP32_lr0.02_bs=2_larger_guided_mask_maskconf=0.85_14B_512x512
optimizer:
  lr: 0.02
  optim_type: fusedadam
  weight_decay: 0.0
checkpoint:
  save_iter: 100  # Full training: 500
trainer:
  max_iter: 200  # Full training: 200000
  logging_iter: 10
  validation_iter: 50 # Full training: 5000
  run_validation: True
  early_stop:
    enabled: False
    metric: nn              # one of "fid" (min) / "mnn" (max) / "nn" (max); direction auto-derived
    patience: 3              # consecutive validations without improvement before stopping
    # scope: Average         # default; set to an anomaly name to monitor one type
    min_delta: 0.03          # minimum improvement to reset patience; interpretation depends on min_delta_mode
    min_delta_mode: rel      # "abs" → best ± min_delta  |  "rel" → best × (1 ± min_delta) (5% etc.)
    # cumulative_delta: False # False (default): best tracks actual best even on no-improve steps → threshold creeps up (stricter).
                              # True: best freezes at last patience-resetting score → threshold stays fixed (more lenient).
scheduler:
  warm_up_steps: 
    - 100
  cycle_lengths:
    - 200000
dataloader_train:
  batch_size: 1
  dataset:
    dataset_dir: datasets/MeiweiPCB/train_downsample
    image_size: 
      - 512
      - 512
    anomaly_types: 
      - 
        - PCB
        - defect     
    seed: 1
    data_augprob: 0.5
dataloader_val:
  batch_size: 32
  dataset:
    input_data_path: ag_inference/validation.jsonl
model:
  config:
    correspondence_backbone: checkpoints/facebook/dinov2-large   # HF ID or local path (currently only DINOv2 is available)
    correspondence_top_k: 3                                      # best-matching refs per gen sample; -1 = use all
    ag_config:
      ad_precision: float32
      anomaly_embedding:
        num_tokens: 256
        anomaly_types:
          - 
            - PCB
            - defect
        freeze: False
      mask_encoder:
        encoder_type: nvdinov2
        encoder_config:
          pool_kernel: 7
          init_cfg:
            checkpoint: checkpoints/NVDINOV2/nv_dinov2_classification_model.ckpt
        freeze: True
      adapter:
        adapter_type: mlp_gelu # transformer
        adapter_config:
          num_layers: 2
          input_hidden_size: 1024
          final_hidden_size: 1024
        freeze: False
      t5_model_name: checkpoints/google-t5/t5-large  # Remove this line if you want to use T5-XXL.
