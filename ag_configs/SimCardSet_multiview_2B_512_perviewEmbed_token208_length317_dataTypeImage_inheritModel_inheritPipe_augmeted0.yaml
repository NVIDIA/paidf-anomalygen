job:
  project: anomaly_gen
  group: SimCardSet
  name: SimCardSet_multiview_2B_512_perviewEmbed_token208_length317_dataTypeImage_inheritModel_inheritPipe
optimizer:
  lr: 0.02
  optim_type: fusedadam
  weight_decay: 0.0
checkpoint:
  save_iter: 2000
trainer:
  max_iter: 150000
  logging_iter: 10
  validation_iter: 2000
  run_validation: True  # Disable validation for initial testing
  callbacks:
    log_image:
      every_n: 237  # Prime number for diverse sampling
scheduler:
  warm_up_steps: 
    - 50
  cycle_lengths:
    - 150000  # Should match max_iter
dataloader_train:
  batch_size: 1  # Small batch size for multi-view (more memory intensive)
  dataset:
    dataset_dir: datasets/SimCardSet
    image_size: 
      - 512
      - 512
    # Multi-view specific settings - SimCardSet has 5 views
    view_types:
      - view1
      - view2
      - view3
      - view4
      - view5
    anomaly_types: 
      - 
        - SimCardSet
        - CH
      - 
        - SimCardSet
        - HS
      - 
        - SimCardSet
        - ZW
    seed: 1
    data_augprob: 0.0
dataloader_val:
  batch_size: 1
  dataset:
    # Create a simple validation jsonl for testing
    input_data_path: ag_inference/simcardset_validation.jsonl
model:
  config:
    # Pipeline configuration - override state_t and net.num_views based on dataset
    pipe_config:
      state_t: 5  # Must match number of views (5 views for SimCardSet)
      net:
        num_views: 5  # Number of camera views for MultiViewDiT (SINGLE SOURCE OF TRUTH)
    ag_config:
      ad_precision: float32
      anomaly_embedding:
        num_tokens: 208  # Reduced from 256 to save T5 memory
        anomaly_types:
          - 
            - SimCardSet
            - CH
          - 
            - SimCardSet
            - HS
          - 
            - SimCardSet
            - ZW
        freeze: False
      mask_encoder:
        encoder_type: nvdinov2
        encoder_config:
          pool_kernel: 7
          init_cfg:
            checkpoint: checkpoints/NVDINOV2/nv_dinov2_classification_model.ckpt
        freeze: True
      adapter:
        adapter_type: mlp_gelu
        adapter_config:
          num_layers: 2
          input_hidden_size: 1024
          final_hidden_size: 1024
        freeze: False
      text_tokenizer:
        max_length: 317

