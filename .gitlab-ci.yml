include:
  - component: $CI_SERVER_FQDN/security/devops-tools/ci-cd-components/sonarqube/sonarqube-scan@2.0.1
    inputs:
      stage: security
      nspect_id: NSPECT-OS84-33VF
      sonar_project_key: "TEGRASW_Metropolis-perf_SDG_cosmos-anomalygen"
      sonar_project_name: "TEGRASW_Metropolis-perf_SDG_cosmos-anomalygen"
      sonar_project_version: "${CI_COMMIT_SHORT_SHA}"
      sonar_source_code_language: python
      allow_failure: true
      vault_role: ""
      rules:
        - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
        - if: $CI_COMMIT_BRANCH == 'anomalyGen'
        - if: $CI_COMMIT_BRANCH == 'main'
        - if: $CI_COMMIT_BRANCH == 'master'
        - if: $CI_COMMIT_BRANCH == 'develop'

  - ref: main
    file: /.gitlab/nvcarps-upstream-ci.yml
    project: nvcarps/ci-group/nvcarps-ci
variables:
  # CI dev image destinations. PERF_REGISTRY_BASE and SDG_REGISTRY_BASE
  # are defined as project-level CI/CD variables so the NGC org/team are
  # not hardcoded in the repo. Promotion from these internal locations
  # to the external PAI-data-factory/paidf-dev org is handled by the
  # artifacts-promotion pipeline.
  PERF_IMAGE: "${PERF_REGISTRY_BASE}/paidf-anomalygen"
  SDG_IMAGE: "${SDG_REGISTRY_BASE}/paidf-anomalygen"

  NVCARPS_CI_TRIGGER_BRANCH: "main"
  NVCARPS_CI_UPSTREAM_PROFILE: "external"
  NVCARPS_CI_AUTO_SIGN: "true"
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: never

stages:
  - security
  - build
  - nvcarps
  - nvskills-pipeline

# ---------------------------------------------------------------------------
# Docker image build + push to NGC
#
# Single-stage build: docker/Dockerfile bundles the compile-heavy deps
# (flash-attn, transformer-engine, apex, opencv, vllm, requirements) and the
# application layer. Heavy steps install from the GitLab PyPI registry via
# GITLAB_PYPI_INDEX_URL — see docker/Dockerfile for the source-compile
# fallback when the URL is unset.
# ---------------------------------------------------------------------------
docker-build-push:
  stage: build
  image: docker:28.4.0-cli
  interruptible: true
  tags:
    - horde
    - docker
  timeout: 4 hours
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - |
      if [ -z "$METRO_PERF_NGC_API_KEY" ]; then
        echo "Error: METRO_PERF_NGC_API_KEY environment variable is not set"
        exit 1
      fi
    - docker info
    - echo "$METRO_PERF_NGC_API_KEY" | docker login nvcr.io -u "\$oauthtoken" --password-stdin
  script:
    - |
      VERSION=$(awk -F' *= *' '/^version *=/ {gsub(/"/, "", $2); print $2; exit}' pyproject.toml)
      if [ -z "$VERSION" ]; then
        echo "Error: Could not extract version from pyproject.toml"
        exit 1
      fi

      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        LABEL="mr$CI_MERGE_REQUEST_IID"
      else
        LABEL="main"
      fi

      IMAGE_TAG="$VERSION-$CI_COMMIT_SHORT_SHA.$LABEL"

      docker pull $PERF_IMAGE:cache || true
      docker build \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --build-arg GITLAB_PYPI_INDEX_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab-master.nvidia.com/api/v4/projects/${CI_PROJECT_ID}/packages/pypi/simple" \
        --cache-from $PERF_IMAGE:cache \
        -f docker/Dockerfile \
        -t $PERF_IMAGE:$IMAGE_TAG \
        -t $PERF_IMAGE:cache \
        -t $SDG_IMAGE:$IMAGE_TAG \
        -t $SDG_IMAGE:cache \
        .

      docker push $PERF_IMAGE:$IMAGE_TAG
      docker push $PERF_IMAGE:cache
      echo "Image pushed to $PERF_IMAGE:$IMAGE_TAG"

      docker push $SDG_IMAGE:$IMAGE_TAG
      docker push $SDG_IMAGE:cache
      echo "Image pushed to $SDG_IMAGE:$IMAGE_TAG"

      docker rmi \
        $PERF_IMAGE:$IMAGE_TAG $PERF_IMAGE:cache \
        $SDG_IMAGE:$IMAGE_TAG $SDG_IMAGE:cache || true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == 'anomalyGen'
    - if: $CI_COMMIT_BRANCH == 'main'
